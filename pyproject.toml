[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-csv-cleaner"
version = "0.1.0"
description = "Une, normaliza y deduplica CSV/Excel de reservas o contactos en un único CSV listo para importar a un CRM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Francisco Oliver Mora" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0,<4",
    "openpyxl~=3.1",
    "PyYAML~=6.0",
    "phonenumbers>=8.13",
]
keywords = ["csv", "crm", "deduplicate", "gohighlevel", "hubspot", "airtable"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/franinho10/crm-csv-cleaner"
Issues = "https://github.com/franinho10/crm-csv-cleaner/issues"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
crm-csv-cleaner = "crm_csv_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
